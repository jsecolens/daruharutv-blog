<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #f4f4f4;
        padding: 15px;
    }

    .interview-wrapper {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        text-align: center;
    }

    .title-box {
        margin-bottom: 12px;
    }

    .title-box h2 {
        margin: 0;
        color: #2c3e50;
        font-size: 2rem;
    }

    .title-box p {
        color: #7f8c8d;
        margin-top: 5px;
    }

    /* PC 권장 안내 박스 */
    .pc-recommend {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        margin-bottom: 20px;
        font-size: 0.9rem;
        display: none;
    }

    .pc-recommend span {
        font-weight: bold;
    }

    @media (max-width: 768px) {
        .pc-recommend {
            display: block;
        }
    }

    .scene-container {
        position: relative;
        width: 100%;
        overflow: visible;
        border-radius: 10px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        cursor: pointer;
    }

    .bg-image {
        width: 100%;
        display: block;
        transition: filter 0.3s;
        border-radius: 10px;
    }

    .spotlight-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        z-index: 1;
        border-radius: 10px;
    }

    .scene-container.active-mode .spotlight-overlay {
        opacity: 1;
    }

    .interviewer-spot {
        position: absolute;
        bottom: 0;
        height: 60%;
        width: 20%;
        z-index: 2;
        transition: all 0.3s;
    }

    .pos-left { left: 10%; }
    .pos-center { left: 40%; }
    .pos-right { right: 10%; }

    .interviewer-spot.speaking {
        box-shadow: 0 0 50px 30px rgba(255, 255, 255, 0.1);
        z-index: 10;
    }

    .bubble {
        position: absolute;
        bottom: 110%;
        left: 50%;
        transform: translateX(-50%) scale(0.5);
        background: #fff;
        color: #333;
        border: 2px solid #2c3e50;
        border-radius: 15px;
        padding: 15px 20px;
        width: 240px;
        font-weight: bold;
        font-size: 1rem;
        opacity: 0;
        visibility: hidden;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        z-index: 20;
    }

    .bubble::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 10px 10px 0;
        border-style: solid;
        border-color: #2c3e50 transparent;
    }

    .bubble.show {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) scale(1);
        bottom: 105%;
    }

    /* 모바일 말풍선 - 이미지 아래 고정 표시 */
    @media (max-width: 768px) {
        body {
            padding: 10px;
        }

        .title-box h2 {
            font-size: 1.3rem;
        }

        .title-box p {
            font-size: 0.85rem;
        }

        .scene-container {
            overflow: visible;
        }

        /* 모바일에서는 말풍선 숨기고 아래 질문 박스 사용 */
        .bubble {
            display: none !important;
        }

        .btn-group button {
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .btn-fullscreen {
            display: none;
        }

        .fullscreen-hint {
            display: none;
        }
    }

    /* 모바일 질문 표시 박스 */
    .mobile-question-box {
        display: none;
        background: #fff;
        border: 3px solid #2c3e50;
        border-radius: 15px;
        padding: 20px;
        margin-top: 15px;
        font-weight: bold;
        font-size: 1rem;
        color: #333;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        min-height: 80px;
        align-items: center;
        justify-content: center;
    }

    @media (max-width: 768px) {
        .mobile-question-box {
            display: flex;
        }

        .mobile-question-box.hidden {
            display: none;
        }

        .mobile-question-box.show {
            display: flex;
        }
    }

    .control-panel {
        margin-top: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .status-bar {
        font-size: 1.1rem;
        font-weight: bold;
        color: #e74c3c;
        height: 24px;
    }

    @media (max-width: 768px) {
        .status-bar {
            font-size: 0.95rem;
        }
    }

    .btn-group {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    .btn-group button {
        padding: 12px 30px;
        font-size: 1rem;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.1s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-start { background-color: #27ae60; color: white; }
    .btn-next { background-color: #3498db; color: white; display: none; }
    .btn-stop { background-color: #95a5a6; color: white; display: none; }
    .btn-fullscreen { background-color: #9b59b6; color: white; }

    .btn-group button:active { transform: scale(0.95); }
    .btn-group button:hover { opacity: 0.9; }

    .timer-bar-bg {
        width: 80%;
        height: 10px;
        background: #ddd;
        border-radius: 5px;
        margin-top: 10px;
        overflow: hidden;
        display: none;
    }

    .timer-bar-fill {
        height: 100%;
        width: 100%;
        background: #27ae60;
        transform-origin: left;
        transition: width 1s linear;
    }

    /* 전체화면 모드 스타일 */
    .interview-wrapper:fullscreen,
    .interview-wrapper:-webkit-full-screen {
        background-color: #1a1a2e;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .interview-wrapper:fullscreen .title-box h2,
    .interview-wrapper:-webkit-full-screen .title-box h2 {
        color: #fff;
        font-size: 2.5rem;
    }

    .interview-wrapper:fullscreen .title-box p,
    .interview-wrapper:-webkit-full-screen .title-box p {
        color: #bbb;
        font-size: 1.2rem;
    }

    .interview-wrapper:fullscreen .scene-container,
    .interview-wrapper:-webkit-full-screen .scene-container {
        max-width: 1400px;
        margin: 0 auto;
        border-radius: 15px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .interview-wrapper:fullscreen .status-bar,
    .interview-wrapper:-webkit-full-screen .status-bar {
        font-size: 1.4rem;
        color: #fff;
    }

    .interview-wrapper:fullscreen .bubble,
    .interview-wrapper:-webkit-full-screen .bubble {
        width: 320px;
        font-size: 1.2rem;
        padding: 20px 25px;
    }

    .interview-wrapper:fullscreen .timer-bar-bg,
    .interview-wrapper:-webkit-full-screen .timer-bar-bg {
        height: 15px;
        max-width: 600px;
    }

    .interview-wrapper:fullscreen .btn-group button,
    .interview-wrapper:-webkit-full-screen .btn-group button {
        padding: 15px 40px;
        font-size: 1.2rem;
    }

    .interview-wrapper:fullscreen .pc-recommend,
    .interview-wrapper:-webkit-full-screen .pc-recommend {
        display: none;
    }

    .fullscreen-hint {
        color: #7f8c8d;
        font-size: 0.9rem;
        margin-top: 10px;
    }

    .interview-wrapper:fullscreen .fullscreen-hint,
    .interview-wrapper:-webkit-full-screen .fullscreen-hint {
        color: #888;
    }
</style>
</head>
<body>

<div class="interview-wrapper" id="interviewWrapper">
    <div class="title-box">
        <h2>최종 면접 시뮬레이션</h2>
        <p>실제 면접장처럼 질문을 듣고 30초 안에 답변해보세요.</p>
    </div>

    <div class="pc-recommend">
        <span>PC 사용을 권장합니다!</span> 더 큰 화면에서 전체화면 모드로 실제 면접장 분위기를 느껴보세요.
    </div>

    <div class="scene-container" id="sceneContainer">
        <img src="/images/interview-panel.jpg" alt="면접장 배경" class="bg-image">

        <div class="spotlight-overlay"></div>

        <div class="interviewer-spot pos-left" id="person-1">
            <div class="bubble" id="bubble-1">자네, 우리 학교의 인재상이 뭐라고 생각하나?</div>
        </div>

        <div class="interviewer-spot pos-center" id="person-2">
            <div class="bubble" id="bubble-2">마지막으로 하고 싶은 말이 있나?</div>
        </div>

        <div class="interviewer-spot pos-right" id="person-3">
            <div class="bubble" id="bubble-3">성적이 다소 낮은데 이유가 뭔가요?</div>
        </div>
    </div>

    <!-- 모바일용 질문 표시 박스 -->
    <div class="mobile-question-box hidden" id="mobileQuestionBox">
        면접 시작 버튼을 눌러주세요.
    </div>

    <div class="control-panel">
        <div class="status-bar" id="statusText">준비가 되면 '면접 시작'을 누르세요.</div>

        <div class="timer-bar-bg" id="timerBarBg">
            <div class="timer-bar-fill" id="timerBarFill"></div>
        </div>

        <div class="btn-group">
            <button class="btn-fullscreen" onclick="toggleFullscreen()">전체화면</button>
            <button class="btn-start" onclick="startInterview()">면접 시작하기</button>
            <button class="btn-next" onclick="nextQuestion()">다음 질문 받기</button>
            <button class="btn-stop" onclick="stopInterview()">종료</button>
        </div>

        <p class="fullscreen-hint">전체화면으로 더욱 몰입감 있게 연습해보세요! (ESC로 나가기)</p>
    </div>
</div>

<script>
    const questions = [
        "우리 대학에 지원하게 된 솔직한 동기는 무엇입니까?",
        "대학 행정 직원으로서 가장 필요한 역량은 무엇이라 생각합니까?",
        "상사가 부당한 지시를 내린다면 어떻게 대처하겠습니까?",
        "최근 대학가가 겪고 있는 가장 큰 위기는 무엇이라고 봅니까?",
        "자신의 성격 중 업무에 방해가 될 수 있는 단점은 무엇입니까?",
        "입사한다면 우리 대학을 위해 어떤 구체적인 기여를 할 수 있습니까?",
        "야근이나 주말 당직 근무에 대해서는 어떻게 생각하나요?",
        "다른 지원자와 차별화되는 본인만의 강점 3가지만 말해보세요.",
        "학창 시절 가장 힘들었던 경험과 그것을 어떻게 극복했는지 말해보세요.",
        "마지막으로 면접관들에게 하고 싶은 질문이 있습니까?",
        "우리 대학의 발전 방향에 대해 어떻게 생각하십니까?",
        "팀원 간 갈등이 발생했을 때 어떻게 해결하겠습니까?",
        "본인이 생각하는 좋은 행정 서비스란 무엇입니까?",
        "학생 민원이 폭주할 때 어떻게 대처하시겠습니까?",
        "5년 후 본인의 모습을 그려본다면 어떤 모습입니까?"
    ];

    let timerInterval;
    let timeLeft = 30;

    function toggleFullscreen() {
        const wrapper = document.getElementById('interviewWrapper');
        const btn = document.querySelector('.btn-fullscreen');

        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (wrapper.requestFullscreen) {
                wrapper.requestFullscreen();
            } else if (wrapper.webkitRequestFullscreen) {
                wrapper.webkitRequestFullscreen();
            }
            btn.innerText = '전체화면 나가기';
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            btn.innerText = '전체화면';
        }
    }

    document.addEventListener('fullscreenchange', function() {
        const btn = document.querySelector('.btn-fullscreen');
        if (!document.fullscreenElement) {
            btn.innerText = '전체화면';
        }
    });

    document.addEventListener('webkitfullscreenchange', function() {
        const btn = document.querySelector('.btn-fullscreen');
        if (!document.webkitFullscreenElement) {
            btn.innerText = '전체화면';
        }
    });

    function startInterview() {
        document.querySelector('.btn-start').style.display = 'none';
        document.querySelector('.btn-next').style.display = 'inline-block';
        document.querySelector('.btn-stop').style.display = 'inline-block';
        document.getElementById('timerBarBg').style.display = 'block';
        document.getElementById('sceneContainer').classList.add('active-mode');

        // 모바일 질문 박스 표시
        document.getElementById('mobileQuestionBox').classList.remove('hidden');
        document.getElementById('mobileQuestionBox').classList.add('show');

        nextQuestion();
    }

    function stopInterview() {
        resetAll();
        document.querySelector('.btn-start').style.display = 'inline-block';
        document.querySelector('.btn-next').style.display = 'none';
        document.querySelector('.btn-stop').style.display = 'none';
        document.getElementById('timerBarBg').style.display = 'none';
        document.getElementById('sceneContainer').classList.remove('active-mode');
        document.getElementById('statusText').innerText = "면접이 종료되었습니다. 수고하셨습니다.";
        document.getElementById('statusText').style.color = "#333";

        // 모바일 질문 박스 숨기기
        document.getElementById('mobileQuestionBox').classList.add('hidden');
        document.getElementById('mobileQuestionBox').classList.remove('show');
    }

    function nextQuestion() {
        resetAll();
        const randomQ = questions[Math.floor(Math.random() * questions.length)];
        const randomPersonId = Math.floor(Math.random() * 3) + 1;
        const person = document.getElementById('person-' + randomPersonId);
        const bubble = document.getElementById('bubble-' + randomPersonId);
        bubble.innerText = randomQ;
        person.classList.add('speaking');
        setTimeout(function() {
            bubble.classList.add('show');
        }, 100);

        // 모바일 질문 박스 업데이트
        document.getElementById('mobileQuestionBox').innerText = randomQ;

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        updateTimerVisual();
        document.getElementById('statusText').innerText = "답변을 시작하세요! (30초)";
        document.getElementById('statusText').style.color = "#e74c3c";

        timerInterval = setInterval(function() {
            timeLeft--;
            updateTimerVisual();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('statusText').innerText = "답변 시간이 종료되었습니다.";
            }
        }, 1000);
    }

    function updateTimerVisual() {
        const percentage = (timeLeft / 30) * 100;
        document.getElementById('timerBarFill').style.width = percentage + '%';
        if(percentage < 30) {
            document.getElementById('timerBarFill').style.background = "#c0392b";
        } else {
            document.getElementById('timerBarFill').style.background = "#27ae60";
        }
    }

    function resetAll() {
        clearInterval(timerInterval);
        document.querySelectorAll('.bubble').forEach(function(el) { el.classList.remove('show'); });
        document.querySelectorAll('.interviewer-spot').forEach(function(el) { el.classList.remove('speaking'); });
    }
</script>

</body>
</html>
